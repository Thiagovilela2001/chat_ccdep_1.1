name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: >-
          mypy src/rag_ccdep/core/api_models.py src/rag_ccdep/core/runtime.py
          src/rag_ccdep/core/provenance.py src/rag_ccdep/core/index_manifest.py
          src/rag_ccdep/core/citation_validator.py src/rag_ccdep/core/metrics.py
      - run: python -m pytest -q
      - run: python benchmarks/benchmark_core.py --iterations 1000
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
