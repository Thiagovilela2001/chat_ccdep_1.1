name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: >-
          mypy rag_core/api_models.py rag_core/runtime.py rag_core/provenance.py
          rag_core/index_manifest.py rag_core/citation_validator.py rag_core/metrics.py
      - run: python -m pytest -q
      - run: python rag_orchestrator/tests/test_router.py
      - run: python rag_orchestrator/tests/test_pipeline.py
      - run: python benchmarks/benchmark_core.py --iterations 1000
      - run: python meta_rag_ui/tests/test_apptest.py
      - run: node --check frontend/app.js
      - run: touch .env
      - run: docker compose config --quiet

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-ccdep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
