[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ccdep"
version = "0.1.0"
description = "Plataforma RAG para análise econômica e social de São Paulo"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
rag-ccdep = "rag_ccdep.cli:main"
rag-principal = "rag_ccdep.engines.principal.__main__:main"
rag-agentic = "rag_ccdep.engines.agentic.__main__:main"
rag-raptor = "rag_ccdep.engines.raptor.__main__:main"
rag-selfrag = "rag_ccdep.engines.selfrag.__main__:main"
rag-orchestrator = "rag_ccdep.orchestrator.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "var", "chroma_backups_*", ".venv"]

[tool.ruff.lint]
# Gate incremental: erros de sintaxe, nomes indefinidos e fluxos inválidos.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(data|documents|chroma_db|chroma_backups_.*)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
