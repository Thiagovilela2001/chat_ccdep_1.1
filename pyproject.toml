[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "documents", "chroma_db", "chroma_backups_*", ".venv"]

[tool.ruff.lint]
# Gate incremental: erros de sintaxe, nomes indefinidos e fluxos inválidos.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(data|documents|chroma_db|chroma_backups_.*)/"

[tool.pytest.ini_options]
testpaths = ["rag_principal/tests", "rag_orchestrator/tests", "meta_rag_ui/tests"]
addopts = "-p no:cacheprovider"
