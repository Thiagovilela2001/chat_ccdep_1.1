services:
  rag-principal: &rag-base
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RAG_CORS_ORIGINS: "*"
      HF_HOME: /cache/huggingface
    restart: unless-stopped
    container_name: rag-ccdep-principal
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/rag_principal/data:ro
      - ./rag_principal/chroma_db:/app/rag_principal/chroma_db
      - ./rag_principal/graph_store:/app/rag_principal/graph_store
      - hf_cache:/cache/huggingface

  rag-agentic:
    <<: *rag-base
    container_name: rag-ccdep-agentic
    working_dir: /app/rag_agentic
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/rag_agentic/data:ro
      - ./rag_agentic/chroma_db:/app/rag_agentic/chroma_db
      - hf_cache:/cache/huggingface

  rag-raptor:
    <<: *rag-base
    container_name: rag-ccdep-raptor
    working_dir: /app/rag_raptor
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/rag_raptor/data:ro
      - ./rag_raptor/chroma_db:/app/rag_raptor/chroma_db
      - hf_cache:/cache/huggingface

  rag-selfrag:
    <<: *rag-base
    container_name: rag-ccdep-selfrag
    working_dir: /app/rag_selfrag
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/rag_selfrag/data:ro
      - ./rag_selfrag/chroma_db:/app/rag_selfrag/chroma_db
      - hf_cache:/cache/huggingface

volumes:
  hf_cache:
