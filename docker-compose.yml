services:
  rag-principal: &rag-base
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:8501,http://127.0.0.1:8501}"
      HF_HOME: /cache/huggingface
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests,sys; d=requests.get('http://127.0.0.1:8000/health',timeout=3).json(); sys.exit(0 if d.get('engine_ready') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    container_name: rag-ccdep-principal
    ports:
      - "127.0.0.1:${RAG_PRINCIPAL_PORT:-8000}:8000"
    volumes:
      - ./data:/app/rag_principal/data:ro
      - ./rag_principal/chroma_db:/app/rag_principal/chroma_db
      - ./rag_principal/graph_store:/app/rag_principal/graph_store
      - hf_cache:/cache/huggingface

  rag-agentic:
    <<: *rag-base
    container_name: rag-ccdep-agentic
    working_dir: /app/rag_agentic
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:${RAG_AGENTIC_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests,sys; d=requests.get('http://127.0.0.1:8001/health',timeout=3).json(); sys.exit(0 if d.get('engine_ready') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - ./data:/app/rag_agentic/data:ro
      - ./rag_agentic/chroma_db:/app/rag_agentic/chroma_db
      - hf_cache:/cache/huggingface

  rag-raptor:
    <<: *rag-base
    container_name: rag-ccdep-raptor
    working_dir: /app/rag_raptor
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:${RAG_RAPTOR_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests,sys; d=requests.get('http://127.0.0.1:8002/health',timeout=3).json(); sys.exit(0 if d.get('engine_ready') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    volumes:
      - ./data:/app/rag_raptor/data:ro
      - ./rag_raptor/chroma_db:/app/rag_raptor/chroma_db
      - hf_cache:/cache/huggingface

  rag-selfrag:
    <<: *rag-base
    container_name: rag-ccdep-selfrag
    working_dir: /app/rag_selfrag
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "127.0.0.1:${RAG_SELFRAG_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests,sys; d=requests.get('http://127.0.0.1:8003/health',timeout=3).json(); sys.exit(0 if d.get('engine_ready') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      - ./data:/app/rag_selfrag/data:ro
      - ./rag_selfrag/chroma_db:/app/rag_selfrag/chroma_db
      - hf_cache:/cache/huggingface

  # Meta RAG — orquestrador. Não indexa; roteia via HTTP para as engines,
  # endereçadas por nome de serviço na rede Docker (não localhost).
  rag-orchestrator:
    <<: *rag-base
    container_name: rag-ccdep-orchestrator
    working_dir: /app/rag_orchestrator
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:8501,http://127.0.0.1:8501}"
      HF_HOME: /cache/huggingface
      RAG_PRINCIPAL_URL: "http://rag-principal:8000"
      RAG_AGENTIC_URL: "http://rag-agentic:8001"
      RAG_RAPTOR_URL: "http://rag-raptor:8002"
      RAG_SELFRAG_URL: "http://rag-selfrag:8003"
    ports:
      - "127.0.0.1:${RAG_ORCHESTRATOR_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests,sys; d=requests.get('http://127.0.0.1:8010/health',timeout=3).json(); sys.exit(0 if d.get('orchestrator_ready') and d.get('status') == 'ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      - rag-principal
      - rag-agentic
      - rag-raptor
      - rag-selfrag

  # Frontend Streamlit. Só fala HTTP; alcança os backends por nome de serviço.
  frontend:
    <<: *rag-base
    container_name: rag-ccdep-frontend
    working_dir: /app
    command: ["streamlit", "run", "meta_rag_ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--browser.gatherUsageStats", "false"]
    env_file: []
    environment:
      META_URL: "http://rag-orchestrator:8010"
      PRINCIPAL_URL: "http://rag-principal:8000"
      AGENTIC_URL: "http://rag-agentic:8001"
      RAPTOR_URL: "http://rag-raptor:8002"
      SELFRAG_URL: "http://rag-selfrag:8003"
    ports:
      - "127.0.0.1:${RAG_FRONTEND_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8501/_stcore/health',timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes: []
    depends_on:
      - rag-orchestrator

volumes:
  hf_cache:
