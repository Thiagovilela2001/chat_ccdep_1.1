<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta
      name="description"
      content="Nadia — assistente de análise econômica da Fundação Seade."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Montserrat:wght@500;600;700&display=swap"
    />
    <title>Nadia · Inteligência para dados públicos</title>
  </head>
  <body>
    <div id="root">
      <main
        id="nadia-bootstrap-status"
        style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#152443;font-family:'DM Sans',system-ui,'Segoe UI',sans-serif;background-image:radial-gradient(120% 60% at 50% -10%,rgba(156,193,231,.55),transparent 62%)"
      >
        <section style="width:min(520px,100%);padding:30px;background:#fff;border:1px solid rgba(21,36,67,.10);border-radius:20px;box-shadow:0 2px 4px rgba(21,36,67,.05),0 18px 42px rgba(21,36,67,.10)">
          <small style="color:#4176e6;font-weight:700;letter-spacing:.16em;font-size:11px">NADIA · SEADE</small>
          <h1 style="margin:12px 0 8px;font-family:Montserrat,'DM Sans',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.02em">Carregando a interface…</h1>
          <p style="margin:0;color:#4e5a70;line-height:1.6;font-size:15px">
            Preparando os componentes e verificando os serviços locais.
          </p>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const reportUrl = "http://127.0.0.1:8501/client-error";

        function errorText(value) {
          if (value instanceof Error) return value.stack || value.message;
          if (typeof value === "string") return value;
          try {
            return JSON.stringify(value);
          } catch {
            return String(value);
          }
        }

        window.__showNadiaBootstrapError = (value) => {
          const message = errorText(value) || "Falha desconhecida durante a inicialização.";
          const root = document.getElementById("root");
          if (root && root.dataset.nadiaMounted !== "true") {
            const status = document.getElementById("nadia-bootstrap-status");
            const title = status?.querySelector("h1");
            const detail = status?.querySelector("p");
            if (title) title.textContent = "A interface não conseguiu iniciar";
            if (detail) detail.textContent = message;
          }
          fetch(reportUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              message,
              href: window.location.href,
              userAgent: navigator.userAgent,
              occurredAt: new Date().toISOString(),
            }),
          }).catch(() => {});
        };

        window.addEventListener("error", (event) => {
          const resource = event.target?.src || event.target?.href;
          window.__showNadiaBootstrapError(
            event.error || event.message || (resource ? `Falha ao carregar ${resource}` : "Erro de carregamento."),
          );
        }, true);
        window.addEventListener("unhandledrejection", (event) => {
          window.__showNadiaBootstrapError(event.reason || "Promise rejeitada sem detalhes.");
        });
        window.setTimeout(() => {
          const root = document.getElementById("root");
          if (root?.dataset.nadiaMounted !== "true") {
            window.__showNadiaBootstrapError(
              "O JavaScript da aplicação não iniciou em até 8 segundos.",
            );
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
