# Tema do frontend Streamlit (RAG Estatístico SP / Seade) — interface premium.
# Tema ÚNICO dark (base garante que os widgets nativos acompanhem o CSS custom).
# O refino visual completo vive em meta_rag_ui/assets/style.css.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
linkColor = "#3B82F6"
borderColor = "rgba(255,255,255,0.06)"
baseRadius = "14px"
font = "sans-serif"

[client]
toolbarMode = "minimal"
